# PostgreSQL 16 tuning for a 2-4 GB single VPS shared with the app.
# Installed to /etc/postgresql/16/main/conf.d/endpoint.conf by setup-server.sh.
listen_addresses = 'localhost'
max_connections = 30            # Hikari pool (10) + psql / pg_dump / scripts

shared_buffers = 256MB          # whole DB (~41 MB today) fits in cache
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 8MB

random_page_cost = 1.1          # SSD
timezone = 'Asia/Bangkok'
log_timezone = 'Asia/Bangkok'
log_min_duration_statement = 1000   # log queries slower than 1 s
