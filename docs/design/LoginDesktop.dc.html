<circle cx="540" cy="470" r="8" fill="#FFFFFF" opacity="0.7"></circle>

<span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg></span>
<span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.1em">ENDPOINT</span>

<div style="position: relative; margin-top: 120px; display: flex; flex-direction: column; gap: 16px; max-width: 480px">
<h2 style="margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 44px; font-weight: 700; line-height: 1.25">จัดการออเดอร์<br>และงานจัดส่ง ในที่เดียว</h2>
<p style="margin: 0; font-size: 18px; opacity: 0.9; line-height: 1.6">รับออเดอร์ จัดเส้นทาง และติดตามการส่งทีละจุด</p>
</div>
<span style="position: relative; margin-top: auto; font-size: 13px; opacity: 0.75">เวอร์ชัน Beta</span>

<main style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 400px; display: flex; flex-direction: column; gap: 22px">
<span style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 32px; font-weight: 700">เข้าสู่ระบบ</h1><span style="font-size: 15px; color: #5B5F66">ใช้บัญชีที่ได้รับจากผู้ดูแลระบบ</span></span>

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3346C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
<input type="text" autocomplete="username" value="somchai.k" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font-size: 16px; background: transparent"></span></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">รหัสผ่าน

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6F76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<input type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font-size: 16px; background: transparent">
<button type="button" aria-label="แสดงรหัสผ่าน" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: #4F535A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
<button type="submit" style="margin-top: 6px; height: 54px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); color: #FFFFFF; font-size: 17px; font-weight: 600; box-shadow: 0 8px 20px rgba(51,70,196,0.28)">เข้าสู่ระบบ</button>
</form>
<span style="text-align: center; font-size: 14px; color: #5B5F66">ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบ</span>
</div>
