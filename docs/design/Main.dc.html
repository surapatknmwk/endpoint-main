<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ออเดอร์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sarabun',sans-serif;background:#F6F6FA;color:#17191C}
button,input{font-family:inherit}
a{color:#3346C4}a:hover{color:#26369B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F6FA; font-family: 'Sarabun', sans-serif; color: #17191C; box-sizing: border-box">

<header style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; background: linear-gradient(90deg, #3346C4, #5B34C9); -webkit-background-clip: text; background-clip: text; color: transparent">ENDPOINT</span>
<h1 style="margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.2">ออเดอร์</h1>
</div>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #D8D7E3; background: #FFFFFF; border-radius: 20px; font-size: 15px; font-weight: 600; color: #17191C">เลือก</button>
</div>

<div style="display: flex; gap: 8px">
<label style="flex-grow: 1; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; background: #FFFFFF; border: 1px solid #D8D7E3; border-radius: 12px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6F76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" placeholder="ค้นหาชื่อ เบอร์ หรือพื้นที่" aria-label="ค้นหาออเดอร์" style="border: 0; outline: 0; background: transparent; font-size: 16px; flex-grow: 1; color: #17191C; min-width: 0">
</label>
<button type="button" aria-label="ตัวกรอง (ใช้อยู่ 1)" style="position: relative; width: 48px; height: 48px; border: 1px solid #D8D7E3; background: #FFFFFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #17191C">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
<span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
</button>
</div>

<div style="display: flex; gap: 4px; padding: 4px; background: #E9E8F2; border-radius: 12px">
<button type="button" style="flex-grow: 1; flex-basis: 0; height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,25,28,0.12); font-size: 15px; font-weight: 600; color: #17191C">ใหม่ <span style="color: #3346C4">12</span></button>
<button type="button" style="flex-grow: 1; flex-basis: 0; height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 15px; font-weight: 500; color: #4F535A">รอจัดส่ง 5</button>
<button type="button" style="flex-grow: 1; flex-basis: 0; height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 15px; font-weight: 500; color: #4F535A">ทั้งหมด</button>
</div>
</header>

<main style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: #5B5F66">วันนี้ · 25 ก.ย.</div>
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E3E2EC; border-radius: 14px; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: #F0F0F6; font-size: 12px; font-weight: 600; color: #3A3E44"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{o.dot}}"></span>{{o.platform}}</span>
<span style="font-size: 13px; color: #6B6F76">{{o.code}}</span>
<span style="margin-left: auto; font-size: 13px; color: #6B6F76">{{o.time}}</span>
</div>
<div style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 17px; font-weight: 600; line-height: 1.35">{{o.name}}</div>
<div style="display: flex; align-items: flex-start; gap: 6px; font-size: 14px; color: #4F535A; line-height: 1.45">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
<span>{{o.area}}</span>
</div>
<div style="font-size: 14px; color: #6B6F76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.detail}}</div>
<div style="display: flex; align-items: center; gap: 4px; margin-top: 4px; padding-top: 6px; border-top: 1px solid #EDEDF3">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; background: transparent; border-radius: 8px; font-size: 14px; font-weight: 600; color: #3346C4">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>โทร</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; background: transparent; border-radius: 8px; font-size: 14px; font-weight: 600; color: #3346C4">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8z"></path></svg>แผนที่</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; background: transparent; border-radius: 8px; font-size: 14px; font-weight: 600; color: #3346C4">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h9"></path></svg>คัดลอก</button>
<button type="button" aria-label="แก้ไข" style="margin-left: auto; width: 40px; height: 40px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #4F535A">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</div>
</article>
</sc-for>
</main>

<button type="button" style="position: absolute; right: 20px; bottom: 96px; height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 28px; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(70,64,200,0.32)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>เพิ่มออเดอร์</button>

<nav aria-label="เมนูหลัก" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E3E2EC; display: flex; padding-bottom: 8px; box-sizing: border-box">
<a href="#" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #3346C4; font-size: 12px; font-weight: 700">
<span style="width: 56px; height: 30px; border-radius: 15px; background: #E9E6FC; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg></span>ออเดอร์</a>
<a href="#" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B5F66; font-size: 12px; font-weight: 500">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg></span>งานจัดส่ง</a>
<a href="#" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B5F66; font-size: 12px; font-weight: 500">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></span>บัญชี</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
orders: [
{ platform: 'LINE', dot: '#2E9E5B', code: '#OD-0142', time: '10:24', name: 'คุณสมศรี ใจดี', area: 'ต.สุเทพ อ.เมืองเชียงใหม่ จ.เชียงใหม่', detail: 'ข้าวสาร 2 กระสอบ, น้ำดื่ม 1 แพ็ค' },
{ platform: 'Facebook', dot: '#2F5BD3', code: '#OD-0141', time: '09:58', name: 'คุณวิชัย แสงทอง', area: 'ต.ริมใต้ อ.แม่ริม จ.เชียงใหม่', detail: 'ตู้เย็น 1 เครื่อง — ส่งก่อนเที่ยง' },
{ platform: 'โทร', dot: '#C77A12', code: '#OD-0139', time: '09:12', name: 'ร้านป้าแดง', area: 'ต.หนองหอย อ.เมืองเชียงใหม่ จ.เชียงใหม่', detail: 'แก๊สหุงต้ม 2 ถัง' }
]
};
}
}
</script>
</body>
</html>
