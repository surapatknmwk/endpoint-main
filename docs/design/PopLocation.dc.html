<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เลือกต้นทาง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sarabun',sans-serif;background:#F6F6FA;color:#17191C}
button,input{font-family:inherit}
a{color:#3346C4}a:hover{color:#26369B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Sarabun', sans-serif; color: #17191C">
<div style="position: absolute; left: 0; top: 0"><dc-import name="Backdrop" kind="jobs" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(23,25,28,0.5)"></div>

<section role="dialog" aria-label="เลือกต้นทาง" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<span style="align-self: center; margin-top: 8px; width: 40px; height: 4px; border-radius: 2px; background: #D1D0DD"></span>
<div style="display: flex; align-items: center; padding: 6px 12px 4px 20px">
<h2 style="margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 20px; font-weight: 700; flex-grow: 1">เลือกต้นทาง</h2>
<button type="button" aria-label="ปิด" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #4F535A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 18px">
<label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 13px; border: 2px solid #3346C4; box-shadow: 0 0 0 4px #E9E6FC; border-radius: 12px; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3346C4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" value="ช้าง" aria-label="ค้นหาตำบล อำเภอ หรือจังหวัด" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font-size: 16px; background: transparent"></label>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #5B5F66">ใช้ล่าสุด</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #CCCBDA; background: #FFFFFF; border-radius: 18px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B5F66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>ช้างเผือก · เมืองเชียงใหม่</button>
<button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #CCCBDA; background: #FFFFFF; border-radius: 18px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B5F66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>สุเทพ · เมืองเชียงใหม่</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #5B5F66">ผลการค้นหา</span>
<ul role="listbox" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<li role="option" style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #EDEDF3">
<span style="width: 36px; height: 36px; border-radius: 18px; background: #EEEBFD; color: #3346C4; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px"><strong style="color: #3346C4">ช้าง</strong>{{r.rest}}</span><span style="font-size: 13px; color: #5B5F66">{{r.area}}</span></span>
</li>
</sc-for>
</ul>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
results: [
{ rest: 'เผือก', area: 'ตำบล · อ.เมืองเชียงใหม่ จ.เชียงใหม่' },
{ rest: 'คลาน', area: 'ตำบล · อ.เมืองเชียงใหม่ จ.เชียงใหม่' },
{ rest: 'เคิ่ง', area: 'ตำบล · อ.แม่แจ่ม จ.เชียงใหม่' }
]
};
}
}
</script>
</body>
</html>
