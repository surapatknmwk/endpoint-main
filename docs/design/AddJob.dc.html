<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สร้างงานจัดส่ง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sarabun',sans-serif;background:#F6F6FA;color:#17191C}
button,input{font-family:inherit}
a{color:#3346C4}a:hover{color:#26369B}
</style>
</helmet>
<div style="width: 390px; height: 980px; position: relative; overflow: hidden; background: #F6F6FA; font-family: 'Sarabun', sans-serif; color: #17191C; box-sizing: border-box">

<header style="padding: 16px 12px 12px; background: #FFFFFF; border-bottom: 1px solid #E3E2EC; display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="ปิด" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #17191C">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>
<h1 style="margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 20px; font-weight: 700">สร้างงานจัดส่ง</h1>
</header>

<main style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 18px">

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #3A3E44">รูปแบบการจัดเส้นทาง</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="false" style="text-align: left; padding: 12px; border: 1px solid #CCCBDA; background: #FFFFFF; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; color: #17191C">
<span style="font-size: 15px; font-weight: 600">เลือกทีละจุด</span>
<span style="font-size: 13px; color: #5B5F66; line-height: 1.4">ระบบแนะนำจุดที่ใกล้ที่สุดถัดไป</span>
</button>
<button type="button" aria-pressed="true" style="text-align: left; padding: 12px; border: 1.5px solid #3346C4; background: #F4F3FE; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; color: #17191C">
<span style="font-size: 15px; font-weight: 600; color: #3346C4">ระบุปลายทาง</span>
<span style="font-size: 13px; color: #3A3E44; line-height: 1.4">แนะนำจุดที่อยู่ระหว่างทาง</span>
</button>
</div>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">ชื่องาน
<input type="text" placeholder="เช่น รอบเช้า · แม่ริม (ไม่บังคับ)" style="height: 48px; padding: 0 14px; border: 1px solid #CCCBDA; border-radius: 10px; font-size: 16px; font-weight: 400; color: #17191C; background: #FFFFFF; box-sizing: border-box"></label>

<section aria-label="เส้นทาง" style="background: #FFFFFF; border: 1px solid #E3E2EC; border-radius: 14px; padding: 6px 0">

<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px">
<span style="width: 28px; height: 28px; border-radius: 14px; border: 2px solid #3346C4; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #3346C4; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 12px; font-weight: 700; color: #5B5F66">ต้นทาง</span><span style="font-size: 15px">ต.ช้างเผือก อ.เมืองเชียงใหม่</span></span>
<button type="button" style="height: 36px; padding: 0 10px; border: 0; background: transparent; font-size: 14px; font-weight: 600; color: #3346C4">เปลี่ยน</button>
</div>

<sc-for list="{{stops}}" as="s" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid #EDEDF3">
<span style="width: 28px; height: 28px; border-radius: 14px; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{s.n}}</span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 600">{{s.name}}</span><span style="font-size: 13px; color: #5B5F66">{{s.area}}</span></span>
<button type="button" aria-label="เอาจุดนี้ออก" style="width: 40px; height: 40px; border: 0; background: transparent; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #5B5F66">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</sc-for>

<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid #EDEDF3">
<span style="width: 28px; height: 28px; border-radius: 14px; background: #17191C; display: flex; align-items: center; justify-content: center; color: #FFFFFF; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 12px; font-weight: 700; color: #5B5F66">ปลายทาง</span><span style="font-size: 15px">ต.ริมเหนือ อ.แม่ริม</span></span>
<button type="button" style="height: 36px; padding: 0 10px; border: 0; background: transparent; font-size: 14px; font-weight: 600; color: #3346C4">เปลี่ยน</button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 17px; font-weight: 700">เพิ่มจุดที่ 3</h2>
<span style="font-size: 13px; color: #5B5F66">ใกล้จุดที่ 2 (คุณสมศรี) และอยู่ระหว่างทางไปปลายทาง</span>
</div>
<sc-for list="{{cands}}" as="c" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; background: #FFFFFF; border: 1px solid #E3E2EC; border-radius: 12px">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{c.name}}</span>
<span style="font-size: 13px; color: #5B5F66">{{c.area}}</span>
<span style="display: flex; gap: 6px; margin-top: 2px">
<span style="height: 22px; padding: 0 8px; border-radius: 6px; background: #EEF0F3; font-size: 12px; font-weight: 600; color: #2B3440; display: inline-flex; align-items: center">{{c.dist}}</span>
<span style="height: 22px; padding: 0 8px; border-radius: 6px; background: {{c.posBg}}; font-size: 12px; font-weight: 600; color: {{c.posFg}}; display: inline-flex; align-items: center">{{c.pos}}</span>
</span>
</span>
<button type="button" aria-label="เพิ่ม {{c.name}}" style="width: 44px; height: 44px; border: 1.5px solid #3346C4; background: #FFFFFF; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #3346C4; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</sc-for>
<button type="button" style="height: 40px; border: 0; background: transparent; font-size: 14px; font-weight: 600; color: #3346C4; align-self: flex-start; padding: 0">กรองตามอำเภอ / ตำบล</button>
</section>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 24px; background: #FFFFFF; border-top: 1px solid #E3E2EC; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; color: #3A3E44"><strong style="color: #17191C">2 จุดส่ง</strong> · ประมาณ 18 กม.</div>
<div style="display: flex; gap: 10px">
<button type="button" style="height: 52px; padding: 0 16px; border: 1px solid #CCCBDA; background: #FFFFFF; border-radius: 12px; font-size: 15px; font-weight: 600; color: #17191C; display: inline-flex; align-items: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2.5"></circle><circle cx="18" cy="5" r="2.5"></circle><path d="M8.5 19H17a3.5 3.5 0 0 0 0-7H7a3.5 3.5 0 0 1 0-7h8.5"></path></svg>ดูเส้นทาง</button>
<button type="button" style="flex-grow: 1; height: 52px; border: 0; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); border-radius: 12px; font-size: 16px; font-weight: 600; color: #FFFFFF">บันทึกงาน</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
renderVals() {
return {
stops: [
{ n: 1, name: 'คุณอำไพ ศรีสุข', area: 'ต.ช้างเผือก อ.เมืองเชียงใหม่' },
{ n: 2, name: 'คุณสมศรี ใจดี', area: 'ต.สุเทพ อ.เมืองเชียงใหม่' }
],
cands: [
{ name: 'คุณวิชัย แสงทอง', area: 'ต.ริมใต้ อ.แม่ริม', dist: '6 กม.', pos: 'ตรงเส้นทาง', posBg: '#E2F2E7', posFg: '#1E6B3A' },
{ name: 'ร้านป้าแดง', area: 'ต.ริมใต้ อ.แม่ริม', dist: '7 กม.', pos: 'ตรงเส้นทาง', posBg: '#E2F2E7', posFg: '#1E6B3A' },
{ name: 'คุณประยูร มีสุข', area: 'ต.ดอนแก้ว อ.แม่ริม', dist: '9 กม.', pos: 'อ้อมเพิ่ม 3 กม.', posBg: '#FDF1D8', posFg: '#7A4E00' }
]
};
}
}
</script>
</body>
</html>
