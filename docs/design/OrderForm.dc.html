<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เพิ่มออเดอร์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sarabun',sans-serif;background:#F6F6FA;color:#17191C}
button,input,textarea{font-family:inherit}
a{color:#3346C4}a:hover{color:#26369B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #3B3D40; font-family: 'Sarabun', sans-serif; color: #17191C; box-sizing: border-box">

<section role="dialog" aria-label="เพิ่มออเดอร์" style="position: absolute; left: 0; right: 0; top: 24px; bottom: 0; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; border-radius: 2px; background: #D1D0DD"></span></div>
<div style="display: flex; align-items: center; padding: 6px 12px 6px 20px">
<h2 style="margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 20px; font-weight: 700">เพิ่มออเดอร์</h2>
<button type="button" aria-label="ปิด" style="margin-left: auto; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #4F535A">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>
</div>

<form style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #3346C4">ลูกค้า</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">ชื่อลูกค้า
<input type="text" value="คุณสมศรี ใจดี" required style="height: 48px; padding: 0 14px; border: 1px solid #CCCBDA; border-radius: 10px; font-size: 16px; font-weight: 400; color: #17191C; background: #FFFFFF; box-sizing: border-box"></label>

<div style="display: flex; gap: 10px">
<label style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">เบอร์โทร
<input type="tel" value="081-234-5678" style="height: 48px; padding: 0 14px; border: 1px solid #CCCBDA; border-radius: 10px; font-size: 16px; font-weight: 400; color: #17191C; background: #FFFFFF; box-sizing: border-box; min-width: 0"></label>
</div>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">ช่องทางที่สั่ง</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border: 1.5px solid #3346C4; background: #EEEBFD; border-radius: 20px; font-size: 14px; font-weight: 600; color: #3346C4; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>LINE</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border: 1px solid #CCCBDA; background: #FFFFFF; border-radius: 20px; font-size: 14px; font-weight: 500; color: #3A3E44">Facebook</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border: 1px solid #CCCBDA; background: #FFFFFF; border-radius: 20px; font-size: 14px; font-weight: 500; color: #3A3E44">โทร</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border: 1px solid #CCCBDA; background: #FFFFFF; border-radius: 20px; font-size: 14px; font-weight: 500; color: #3A3E44">อื่นๆ</button>
</div>
</fieldset>

<div style="height: 1px; background: #EDEDF3; margin: 2px 0"></div>
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #3346C4">ที่อยู่จัดส่ง</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">บ้านเลขที่ / ถนน / จุดสังเกต
<textarea rows="2" style="padding: 12px 14px; border: 1px solid #CCCBDA; border-radius: 10px; font-size: 16px; font-weight: 400; color: #17191C; resize: none; line-height: 1.45; box-sizing: border-box">99/1 ซ.5 ถ.ห้วยแก้ว ตรงข้ามร้านกาแฟ</textarea></label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">ตำบล / อำเภอ / จังหวัด
<span style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border: 1px solid #CCCBDA; border-radius: 10px; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6F76" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="text" value="สุเทพ › เมืองเชียงใหม่ › เชียงใหม่" style="border: 0; outline: 0; flex-grow: 1; font-size: 16px; font-weight: 400; color: #17191C; min-width: 0; background: transparent"></span>
<span style="font-size: 13px; font-weight: 400; color: #5B5F66">พิมพ์ชื่อตำบลแล้วเลือก · รหัสไปรษณีย์ <strong style="color: #17191C">50200</strong> เติมให้อัตโนมัติ</span>
</label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">ลิงก์ Google Maps <span style="font-weight: 400; color: #5B5F66">(ถ้ามี)</span>
<span style="display: flex; gap: 8px">
<input type="url" placeholder="วางลิงก์ที่นี่" style="flex-grow: 1; height: 48px; padding: 0 14px; border: 1px solid #CCCBDA; border-radius: 10px; font-size: 16px; font-weight: 400; color: #17191C; box-sizing: border-box; min-width: 0">
<button type="button" style="height: 48px; padding: 0 14px; border: 1px solid #CCCBDA; background: #F6F6FA; border-radius: 10px; font-size: 14px; font-weight: 600; color: #17191C">วาง</button>
</span></label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">รายละเอียดสินค้า / หมายเหตุ
<textarea rows="2" style="padding: 12px 14px; border: 1px solid #CCCBDA; border-radius: 10px; font-size: 16px; font-weight: 400; color: #17191C; resize: none; line-height: 1.45; box-sizing: border-box">ข้าวสาร 2 กระสอบ, น้ำดื่ม 1 แพ็ค</textarea></label>
</form>

<div style="padding: 12px 20px 24px; border-top: 1px solid #E3E2EC; display: flex; gap: 10px">
<button type="button" style="height: 52px; padding: 0 20px; border: 1px solid #CCCBDA; background: #FFFFFF; border-radius: 12px; font-size: 16px; font-weight: 600; color: #17191C">ยกเลิก</button>
<button type="submit" style="flex-grow: 1; height: 52px; border: 0; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); border-radius: 12px; font-size: 16px; font-weight: 600; color: #FFFFFF">บันทึกออเดอร์</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
