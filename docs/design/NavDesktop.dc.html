<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Navbar · เดสก์ท็อป</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Sarabun',sans-serif;background:#F6F6FA;color:#17191C}
button,input{font-family:inherit}
a{color:#3346C4}a:hover{color:#26369B}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F6F6FA; font-family: 'Sarabun', sans-serif; color: #17191C; overflow: hidden">

<aside style="width: 256px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E3E2EC; display: flex; flex-direction: column; padding: 24px 16px; box-sizing: border-box; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg></span>
<span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; background: linear-gradient(90deg, #3346C4, #5B34C9); -webkit-background-clip: text; background-clip: text; color: transparent">ENDPOINT</span>
</div>

<nav aria-label="เมนูหลัก" style="display: flex; flex-direction: column; gap: 4px">
<span style="padding: 0 12px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #5B5F66">เมนู</span>
<sc-for list="{{menu}}" as="m" hint-placeholder-count="4">
<a href="#" aria-current="{{m.current}}" style="position: relative; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: {{m.bg}}; color: {{m.color}}; text-decoration: none; font-size: 15px; font-weight: {{m.weight}}">
<span style="position: absolute; left: -16px; top: 10px; width: 4px; height: 24px; border-radius: 0 3px 3px 0; background: {{m.bar}}"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
<span style="flex-grow: 1">{{m.label}}</span>
<sc-if value="{{m.hasCount}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: {{m.countBg}}; color: {{m.countFg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{m.count}}</span></sc-if>
</a>
</sc-for>
</nav>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 10px">
<span style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3A3E44"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"></path></svg>โหมดมืด</span>
<button type="button" role="switch" aria-checked="false" aria-label="โหมดมืด" style="width: 40px; height: 24px; border: 0; border-radius: 12px; background: #D8D7E3; padding: 3px; display: flex"><span style="width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(23,25,28,0.25)"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #E3E2EC; border-radius: 12px">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 17px; background: #EEEBFD; color: #3346C4; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">ส</span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 14px; font-weight: 600">[ชื่อผู้ใช้]</span><span style="font-size: 12px; color: #5B5F66">ผู้จัดการส่ง</span></span>
<button type="button" aria-label="ออกจากระบบ" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: transparent; color: #4F535A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></button>
</div>
</div>
</aside>

<main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div style="height: 72px; padding: 0 32px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #E3E2EC; background: #FFFFFF">
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #5B5F66">เมนู › งานจัดส่ง</span><span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 22px; font-weight: 700">งานจัดส่ง</span></span>
<label style="margin-left: auto; width: 320px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #D8D7E3; border-radius: 10px; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6F76" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="ค้นหางาน" aria-label="ค้นหางาน" style="border: 0; outline: 0; flex-grow: 1; font-size: 15px; min-width: 0"></label>
<button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>สร้างงานใหม่</button>
</div>
<div style="padding: 28px 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #E3E2EC; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 17px; font-weight: 600">{{c.name}}</span><span style="font-size: 13px; color: #5B5F66">{{c.meta}}</span></span>
<span style="font-size: 13px; color: #3A3E44">ส่งแล้ว <strong>{{c.done}}</strong> จาก {{c.total}} จุด</span>
<span style="height: 6px; border-radius: 3px; background: #E3E2EC; overflow: hidden; display: flex"><span style="width: {{c.pct}}; background: linear-gradient(90deg, #3346C4, #5B34C9)"></span></span>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const item = (label, d, on, count, alert) => ({
label, d,
current: on ? 'page' : 'false',
bg: on ? '#EEEBFD' : 'transparent',
color: on ? '#3346C4' : '#3A3E44',
weight: on ? 700 : 500,
bar: on ? 'linear-gradient(180deg, #3346C4, #5B34C9)' : 'transparent',
hasCount: count !== '',
count,
countBg: alert ? '#B42318' : (on ? '#3346C4' : '#EDEDF3'),
countFg: alert || on ? '#FFFFFF' : '#3A3E44'
});
return {
menu: [
item('ออเดอร์', 'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8', false, '12', false),
item('งานจัดส่ง', 'M3 6h11v10H3zM14 9h4l3 3v4h-7M5.2 17.5a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0-3.6 0M15.2 17.5a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0-3.6 0', true, '3', false),
item('แผนที่', 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14', false, '', false),
item('สรุปผล', 'M4 20V11M10 20V5M16 20v-7M21 20H3', false, '', false)
],
cards: [
{ name: 'รอบเช้า · แม่ริม', meta: 'JOB-0021 · นัดส่ง 25 ก.ย.', done: 2, total: 5, pct: '40%' },
{ name: 'รอบบ่าย · ในเมือง', meta: 'JOB-0022 · นัดส่ง 25 ก.ย.', done: 0, total: 4, pct: '0%' },
{ name: 'JOB-0019', meta: 'นัดส่ง 24 ก.ย.', done: 3, total: 4, pct: '75%' }
]
};
}
}
</script>
</body>
</html>
