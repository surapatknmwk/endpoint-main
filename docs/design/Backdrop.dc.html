<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>พื้นหลังหน้าจอ (ใช้ซ้ำ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div aria-hidden="true" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F6FA; font-family: 'Sarabun', sans-serif; color: #17191C; box-sizing: border-box">
<div style="padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #3346C4">ENDPOINT</span>
<span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.2">{{title}}</span>
</div>
<div style="display: flex; gap: 4px; padding: 4px; background: #E9E8F2; border-radius: 12px">
<span style="flex-grow: 1; flex-basis: 0; height: 40px; border-radius: 9px; background: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{tab1}}</span>
<span style="flex-grow: 1; flex-basis: 0; height: 40px; font-size: 15px; color: #4F535A; display: flex; align-items: center; justify-content: center">{{tab2}}</span>
</div>
</div>
<div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E3E2EC; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #6B6F76">{{r.meta}}</span>
<span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 17px; font-weight: 600">{{r.name}}</span>
<span style="font-size: 14px; color: #4F535A">{{r.area}}</span>
<span style="margin-top: 8px; height: 6px; border-radius: 3px; background: #EDEDF3"></span>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #E3E2EC; display: flex; padding-bottom: 8px; box-sizing: border-box">
<span style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{navA}}"><span style="width: 56px; height: 30px; border-radius: 15px; background: {{pillA}}"></span>ออเดอร์</span>
<span style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: {{navB}}"><span style="width: 56px; height: 30px; border-radius: 15px; background: {{pillB}}"></span>งานจัดส่ง</span>
<span style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #5B5F66"><span style="width: 56px; height: 30px"></span>บัญชี</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["orders","jobs"],"default":"orders"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const jobs = (this.props.kind ?? 'orders') === 'jobs';
return jobs ? {
title: 'งานจัดส่ง', tab1: 'กำลังส่ง 3', tab2: 'ส่งครบแล้ว',
navA: '#5B5F66', pillA: 'transparent', navB: '#3346C4', pillB: '#E9E6FC',
rows: [
{ meta: 'JOB-0021 · นัดส่ง 25 ก.ย.', name: 'รอบเช้า · แม่ริม', area: 'ช้างเผือก → ริมใต้ · ส่งแล้ว 2/5' },
{ meta: 'JOB-0022 · นัดส่ง 25 ก.ย.', name: 'รอบบ่าย · ในเมือง', area: 'ช้างเผือก → หนองหอย · ส่งแล้ว 0/4' },
{ meta: 'นัดส่ง 24 ก.ย.', name: 'JOB-0019', area: 'สุเทพ → สันผีเสื้อ · ส่งแล้ว 3/4' }
]
} : {
title: 'ออเดอร์', tab1: 'ใหม่ 12', tab2: 'รอจัดส่ง 5',
navA: '#3346C4', pillA: '#E9E6FC', navB: '#5B5F66', pillB: 'transparent',
rows: [
{ meta: 'LINE · #OD-0142', name: 'คุณสมศรี ใจดี', area: 'ต.สุเทพ อ.เมืองเชียงใหม่' },
{ meta: 'Facebook · #OD-0141', name: 'คุณวิชัย แสงทอง', area: 'ต.ริมใต้ อ.แม่ริม' },
{ meta: 'โทร · #OD-0139', name: 'ร้านป้าแดง', area: 'ต.หนองหอย อ.เมืองเชียงใหม่' },
{ meta: 'LINE · #OD-0137', name: 'คุณอำไพ ศรีสุข', area: 'ต.ช้างเผือก อ.เมืองเชียงใหม่' }
]
};
}
}
</script>
</body>
</html>
