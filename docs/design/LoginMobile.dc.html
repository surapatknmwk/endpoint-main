<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เข้าสู่ระบบ · มือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: linear-gradient(160deg, #3346C4 0%, #5B34C9 100%); font-family: 'Sarabun', sans-serif; color: #17191C">

<svg width="390" height="330" viewBox="0 0 390 330" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="M-20 250 C 60 200, 110 290, 190 220 S 330 120, 420 170" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"></path>
<circle cx="190" cy="220" r="7" fill="#FFFFFF" opacity="0.9"></circle>
<circle cx="312" cy="146" r="5" fill="#FFFFFF" opacity="0.6"></circle>
<circle cx="70" cy="228" r="5" fill="#FFFFFF" opacity="0.6"></circle>
<circle cx="330" cy="60" r="90" fill="rgba(255,255,255,0.06)"></circle>
<circle cx="40" cy="40" r="60" fill="rgba(255,255,255,0.05)"></circle>
</svg>

<div style="position: absolute; left: 28px; top: 64px; right: 28px; display: flex; flex-direction: column; gap: 16px; color: #FFFFFF">
<span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.08em">ENDPOINT</span><span style="font-size: 16px; opacity: 0.9">จัดการออเดอร์และงานจัดส่ง ในที่เดียว</span></span>
</div>

<main style="position: absolute; left: 0; right: 0; bottom: 0; top: 300px; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 32px 24px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 26px; font-weight: 700">เข้าสู่ระบบ</h1>

<sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: #FDE8E6; border-radius: 12px; font-size: 14px; color: #8A1C12; line-height: 1.5">
<span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: #B42318; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px">!</span>
<span><strong>ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</strong><br>ตรวจสอบแป้นพิมพ์ภาษา และ Caps Lock แล้วลองอีกครั้ง</span>
</div>
</sc-if>

<form style="display: flex; flex-direction: column; gap: 16px; opacity: {{formOpacity}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">ชื่อผู้ใช้
<span style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1px solid #CCCBDA; border-radius: 12px; box-sizing: border-box; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6F76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
<input type="text" autocomplete="username" placeholder="กรอกชื่อผู้ใช้" value="{{username}}" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font-family: inherit; font-size: 16px; color: #17191C; background: transparent"></span></label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3A3E44">รหัสผ่าน
<span style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px 0 14px; border: {{pwBorder}}; border-radius: 12px; box-sizing: border-box; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6F76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<input type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" value="{{password}}" style="border: 0; outline: 0; flex-grow: 1; min-width: 0; font-family: inherit; font-size: 16px; color: #17191C; background: transparent">
<button type="button" aria-label="แสดงรหัสผ่าน" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: #4F535A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>

<button type="submit" style="margin-top: 6px; height: 54px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #3346C4 0%, #5B34C9 100%); color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 20px rgba(51,70,196,0.28)">
<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="19" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="6"></circle><path d="M24 5a19 19 0 0 1 19 19" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path></svg></sc-if>{{buttonLabel}}</button>
</form>

<span style="text-align: center; font-size: 14px; color: #5B5F66">ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบ</span>
<span style="margin-top: auto; text-align: center; font-size: 12px; color: #6B6F76">เวอร์ชัน Beta</span>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","error","loading"],"default":"default"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.props.state ?? 'default';
const filled = s !== 'default';
return {
isError: s === 'error',
isLoading: s === 'loading',
username: filled ? 'somchai.k' : '',
password: filled ? 'password' : '',
pwBorder: s === 'error' ? '2px solid #B42318' : '1px solid #CCCBDA',
formOpacity: s === 'loading' ? '0.85' : '1',
buttonLabel: s === 'loading' ? 'กำลังเข้าสู่ระบบ…' : 'เข้าสู่ระบบ'
};
}
}
</script>
</body>
</html>
